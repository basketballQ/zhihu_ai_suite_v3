<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 315 175" width="315" height="175">
  <defs>

    <!-- 深夜蓝背景渐变 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0b1a3b"/>
      <stop offset="55%"  stop-color="#0d2360"/>
      <stop offset="100%" stop-color="#112e87"/>
    </linearGradient>

    <!-- 图标光晕 -->
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0"/>
    </radialGradient>

    <!-- 节点渐变 -->
    <radialGradient id="topNode" cx="40%" cy="30%" r="60%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </radialGradient>

    <!-- 箭头渐变 -->
    <linearGradient id="arrowG" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- 文字蓝色渐变 -->
    <linearGradient id="textAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- 发光滤镜（强）- 收紧模糊半径保持锐利 -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 发光滤镜（柔） -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- ── 背景 ── -->
  <rect width="315" height="175" fill="url(#bg)"/>

  <!-- 微网格线（电路板感） -->
  <g stroke="rgba(100,150,255,0.055)" stroke-width="0.8">
    <line x1="0"   y1="35"  x2="315" y2="35"/>
    <line x1="0"   y1="70"  x2="315" y2="70"/>
    <line x1="0"   y1="105" x2="315" y2="105"/>
    <line x1="0"   y1="140" x2="315" y2="140"/>
    <line x1="45"  y1="0"   x2="45"  y2="175"/>
    <line x1="90"  y1="0"   x2="90"  y2="175"/>
    <line x1="135" y1="0"   x2="135" y2="175"/>
    <line x1="180" y1="0"   x2="180" y2="175"/>
    <line x1="225" y1="0"   x2="225" y2="175"/>
    <line x1="270" y1="0"   x2="270" y2="175"/>
  </g>

  <!-- 右下雷达弧装饰 -->
  <g fill="none" stroke="rgba(99,179,255,0.10)" stroke-width="1.2" stroke-linecap="round">
    <path d="M 315 175 A 70  70  0 0 0 245 105"/>
    <path d="M 315 175 A 110 110 0 0 0 205  65"/>
    <path d="M 315 175 A 150 150 0 0 0 165  25"/>
  </g>

  <!-- 右上散点 -->
  <g fill="rgba(147,197,253,0.18)">
    <circle cx="265" cy="18" r="2"/><circle cx="282" cy="18" r="2"/><circle cx="299" cy="18" r="2"/>
    <circle cx="265" cy="33" r="2"/><circle cx="282" cy="33" r="2"/><circle cx="299" cy="33" r="2"/>
    <circle cx="265" cy="48" r="2"/><circle cx="282" cy="48" r="2"/><circle cx="299" cy="48" r="2"/>
  </g>

  <!-- ── 左侧图标区（圆心 70,90） ── -->

  <!-- 光晕背景球 -->
  <circle cx="70" cy="90" r="52" fill="url(#orb)"/>

  <!-- 外环虚圈 -->
  <circle cx="70" cy="90" r="44" fill="none" stroke="rgba(99,179,255,0.18)" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- 神经网络连接线 -->
  <g stroke="rgba(147,197,253,0.45)" stroke-width="1.6" stroke-linecap="round" fill="none">
    <!-- 底层三节点互连 -->
    <line x1="47" y1="118" x2="70"  y2="118"/>
    <line x1="70" y1="118" x2="93"  y2="118"/>
    <!-- 底 → 中 -->
    <line x1="47" y1="118" x2="59"  y2="95"/>
    <line x1="70" y1="118" x2="59"  y2="95"/>
    <line x1="70" y1="118" x2="81"  y2="95"/>
    <line x1="93" y1="118" x2="81"  y2="95"/>
    <!-- 中层互连 -->
    <line x1="59" y1="95"  x2="81"  y2="95"/>
    <!-- 中 → 顶 -->
    <line x1="59" y1="95"  x2="70"  y2="68"/>
    <line x1="81" y1="95"  x2="70"  y2="68"/>
  </g>

  <!-- 底层节点 × 3 -->
  <g filter="url(#softGlow)">
    <circle cx="47" cy="118" r="5.5" fill="#3b82f6" opacity="0.85"/>
    <circle cx="70" cy="118" r="5.5" fill="#3b82f6" opacity="0.85"/>
    <circle cx="93" cy="118" r="5.5" fill="#3b82f6" opacity="0.85"/>
  </g>

  <!-- 中层节点 × 2 -->
  <g filter="url(#softGlow)">
    <circle cx="59" cy="95" r="7" fill="#60a5fa" opacity="0.92"/>
    <circle cx="81" cy="95" r="7" fill="#60a5fa" opacity="0.92"/>
  </g>

  <!-- 顶层节点（最亮） -->
  <circle cx="70" cy="68" r="10" fill="url(#topNode)" filter="url(#glow)"/>

  <!-- 上升箭头 -->
  <g stroke="url(#arrowG)" stroke-width="2.8" stroke-linecap="round"
     stroke-linejoin="round" fill="none" filter="url(#glow)">
    <line x1="70" y1="55" x2="70" y2="36"/>
    <polyline points="61,46 70,35 79,46"/>
  </g>

  <!-- ── 分割线 ── -->
  <line x1="128" y1="22" x2="128" y2="153"
        stroke="rgba(147,197,253,0.15)" stroke-width="1"/>

  <!-- ── 右侧文字 ── -->

  <!-- 主标题：知乎 AI -->
  <text x="147" y="73"
        font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',STHeiti,sans-serif"
        font-size="38" font-weight="800" fill="white"
        letter-spacing="0.5">知乎 AI</text>

  <!-- 副标题横线装饰 -->
  <rect x="147" y="82" width="32" height="2.5" rx="1.25" fill="url(#textAccent)" opacity="0.7"/>

  <!-- 副标题：创作增长工具套件 -->
  <text x="147" y="110"
        font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',STHeiti,sans-serif"
        font-size="18.5" font-weight="500"
        fill="rgba(147,197,253,0.95)" letter-spacing="3.5">
    创作增长工具套件
  </text>

  <!-- 英文副标题 -->
  <text x="148" y="133"
        font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-size="10" font-weight="400"
        fill="rgba(147,197,253,0.55)" letter-spacing="1.3">
    Zhihu AI Creation Growth Toolkit
  </text>

  <!-- v3.0 徽章 -->
  <rect x="147" y="144" width="42" height="18" rx="9"
        fill="rgba(59,130,246,0.28)"
        stroke="rgba(147,197,253,0.28)" stroke-width="1"/>
  <text x="168" y="157" text-anchor="middle"
        font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-size="10" font-weight="700" fill="rgba(200,225,255,0.9)"
        letter-spacing="0.8">v 3.0</text>

  <!-- 四角点 -->
  <g fill="rgba(147,197,253,0.25)">
    <circle cx="8"   cy="8"   r="2"/>
    <circle cx="307" cy="8"   r="2"/>
    <circle cx="8"   cy="167" r="2"/>
    <circle cx="307" cy="167" r="2"/>
  </g>

</svg>
