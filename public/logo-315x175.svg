<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 315 175" width="315" height="175">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a6eff"/>
      <stop offset="100%" stop-color="#002fa7"/>
    </linearGradient>
    <linearGradient id="iconG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a0c8ff"/>
    </linearGradient>
    <radialGradient id="nodeG" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="315" height="175" rx="0" fill="url(#bg)"/>

  <!-- 左下雷达弧 -->
  <g fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.5" stroke-linecap="round">
    <path d="M 0 175 A 55 55 0 0 1 55 120"/>
    <path d="M 0 175 A 95 95 0 0 1 95 80"/>
    <path d="M 0 175 A 135 135 0 0 1 135 40"/>
  </g>

  <!-- 右上点阵装饰 -->
  <g fill="rgba(255,255,255,0.12)">
    <circle cx="230" cy="22" r="2.5"/><circle cx="248" cy="22" r="2.5"/><circle cx="266" cy="22" r="2.5"/><circle cx="284" cy="22" r="2.5"/><circle cx="302" cy="22" r="2.5"/>
    <circle cx="230" cy="40" r="2.5"/><circle cx="248" cy="40" r="2.5"/><circle cx="266" cy="40" r="2.5"/><circle cx="284" cy="40" r="2.5"/><circle cx="302" cy="40" r="2.5"/>
    <circle cx="230" cy="58" r="2.5"/><circle cx="248" cy="58" r="2.5"/><circle cx="266" cy="58" r="2.5"/><circle cx="284" cy="58" r="2.5"/><circle cx="302" cy="58" r="2.5"/>
  </g>

  <!-- ── 左侧神经网络图标 ── -->
  <!-- 连接线 -->
  <g stroke="rgba(255,255,255,0.38)" stroke-width="1.8" stroke-linecap="round" fill="none">
    <line x1="44" y1="135" x2="62" y2="135"/>
    <line x1="62" y1="135" x2="80" y2="135"/>
    <line x1="44" y1="135" x2="53" y2="110"/>
    <line x1="62" y1="135" x2="53" y2="110"/>
    <line x1="62" y1="135" x2="71" y2="110"/>
    <line x1="80" y1="135" x2="71" y2="110"/>
    <line x1="53" y1="110" x2="71" y2="110"/>
    <line x1="53" y1="110" x2="62" y2="82"/>
    <line x1="71" y1="110" x2="62" y2="82"/>
  </g>
  <!-- 底层节点 -->
  <circle cx="44" cy="135" r="6" fill="url(#iconG)" opacity="0.85" filter="url(#glow)"/>
  <circle cx="62" cy="135" r="6" fill="url(#iconG)" opacity="0.85" filter="url(#glow)"/>
  <circle cx="80" cy="135" r="6" fill="url(#iconG)" opacity="0.85" filter="url(#glow)"/>
  <!-- 中层节点 -->
  <circle cx="53" cy="110" r="8"  fill="url(#iconG)" opacity="0.92" filter="url(#glow)"/>
  <circle cx="71" cy="110" r="8"  fill="url(#iconG)" opacity="0.92" filter="url(#glow)"/>
  <!-- 顶层节点 -->
  <circle cx="62" cy="82" r="11" fill="url(#nodeG)" filter="url(#glow)"/>
  <!-- 箭头 -->
  <g stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <line x1="62" y1="69" x2="62" y2="52"/>
    <polyline points="53,62 62,50 71,62"/>
  </g>

  <!-- 竖向分割线 -->
  <line x1="108" y1="30" x2="108" y2="145" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

  <!-- ── 右侧文字 ── -->
  <!-- 主标题 -->
  <text x="124" y="78"
        font-family="'PingFang SC','Microsoft YaHei',STXihei,sans-serif"
        font-size="30" font-weight="700" fill="white" letter-spacing="0.5">
    知乎 AI 创作增长
  </text>
  <!-- 副标题 -->
  <text x="124" y="108"
        font-family="'PingFang SC','Microsoft YaHei',STXihei,sans-serif"
        font-size="19" font-weight="400" fill="rgba(200,220,255,0.88)" letter-spacing="2">
    工具套件
  </text>
  <!-- 英文 -->
  <text x="125" y="135"
        font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-size="12" font-weight="400" fill="rgba(160,200,255,0.75)" letter-spacing="1.5">
    Zhihu AI Creation Growth Toolkit
  </text>

  <!-- v3.0 徽章 -->
  <rect x="124" y="145" width="44" height="18" rx="9" fill="rgba(255,255,255,0.18)"/>
  <text x="146" y="158" text-anchor="middle"
        font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-size="11" font-weight="600" fill="white" letter-spacing="0.5">v3.0</text>

</svg>
