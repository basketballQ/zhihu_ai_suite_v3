<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120">
  <defs>
    <linearGradient id="bgH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a6eff"/>
      <stop offset="100%" stop-color="#002fa7"/>
    </linearGradient>
    <linearGradient id="iconH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a0c8ff"/>
    </linearGradient>
    <radialGradient id="nodeH" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </radialGradient>
    <filter id="glowH">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="640" height="120" rx="20" fill="url(#bgH)"/>

  <!-- 左侧图标区域（缩小版神经网络） -->
  <!-- 雷达弧 -->
  <g fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-linecap="round">
    <path d="M 18 102 A 28 28 0 0 1 46 74"/>
    <path d="M 18 102 A 48 48 0 0 1 66 54"/>
  </g>

  <!-- 连接线 -->
  <g stroke="rgba(255,255,255,0.35)" stroke-width="1.8" stroke-linecap="round" fill="none">
    <line x1="46" y1="90" x2="66" y2="90"/>
    <line x1="66" y1="90" x2="86" y2="90"/>
    <line x1="46" y1="90" x2="56" y2="68"/>
    <line x1="66" y1="90" x2="56" y2="68"/>
    <line x1="66" y1="90" x2="76" y2="68"/>
    <line x1="86" y1="90" x2="76" y2="68"/>
    <line x1="56" y1="68" x2="76" y2="68"/>
    <line x1="56" y1="68" x2="66" y2="44"/>
    <line x1="76" y1="68" x2="66" y2="44"/>
  </g>

  <!-- 底层节点 -->
  <g filter="url(#glowH)">
    <circle cx="46" cy="90" r="6" fill="url(#iconH)" opacity="0.85"/>
    <circle cx="66" cy="90" r="6" fill="url(#iconH)" opacity="0.85"/>
    <circle cx="86" cy="90" r="6" fill="url(#iconH)" opacity="0.85"/>
  </g>
  <!-- 中层节点 -->
  <g filter="url(#glowH)">
    <circle cx="56" cy="68" r="7.5" fill="url(#iconH)" opacity="0.92"/>
    <circle cx="76" cy="68" r="7.5" fill="url(#iconH)" opacity="0.92"/>
  </g>
  <!-- 顶层节点 -->
  <circle cx="66" cy="44" r="10" fill="url(#nodeH)" filter="url(#glowH)"/>

  <!-- 上升箭头 -->
  <g stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glowH)">
    <line x1="66" y1="32" x2="66" y2="20"/>
    <polyline points="57,28 66,18 75,28"/>
  </g>

  <!-- 分隔线 -->
  <line x1="118" y1="22" x2="118" y2="98" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- 主标题 -->
  <text x="136" y="52" font-family="'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="26" font-weight="700" fill="white" letter-spacing="1">
    知乎 AI 创作增长套件
  </text>

  <!-- 英文副标题 -->
  <text x="137" y="80" font-family="'SF Pro Display','Helvetica Neue',sans-serif"
        font-size="14" font-weight="400" fill="rgba(160,200,255,0.9)" letter-spacing="2">
    Zhihu AI Creation Growth Toolkit
  </text>

  <!-- 右侧版本徽章 -->
  <rect x="546" y="42" width="68" height="28" rx="14" fill="rgba(255,255,255,0.15)"/>
  <text x="580" y="61" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',sans-serif"
        font-size="13" font-weight="600" fill="white" letter-spacing="1">
    v3.0
  </text>

</svg>
