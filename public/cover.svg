<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060d1f"/>
      <stop offset="100%" style="stop-color:#0a1a3a"/>
    </linearGradient>
    <!-- 蓝色光晕 -->
    <radialGradient id="glow1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#1a4fff;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#1a4fff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="65%" r="45%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:0"/>
    </radialGradient>
    <!-- 卡片渐变 -->
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00c896;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00c896;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="card4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.05"/>
    </linearGradient>
    <!-- 标题渐变 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4d9fff"/>
      <stop offset="50%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#7cb9ff"/>
    </linearGradient>
    <!-- 模糊滤镜 -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardBlur">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow1)"/>
  <rect width="1280" height="720" fill="url(#glow2)"/>

  <!-- 网格点阵 -->
  <g opacity="0.06">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.2" fill="#4d9fff"/>
    </pattern>
    <rect width="1280" height="720" fill="url(#dots)"/>
  </g>

  <!-- 装饰弧线 -->
  <g opacity="0.08" stroke="#4d9fff" stroke-width="1" fill="none">
    <ellipse cx="120" cy="360" rx="180" ry="180"/>
    <ellipse cx="120" cy="360" rx="240" ry="240"/>
    <ellipse cx="1160" cy="360" rx="180" ry="180"/>
    <ellipse cx="1160" cy="360" rx="240" ry="240"/>
  </g>

  <!-- 神经网络节点装饰（左上） -->
  <g opacity="0.25" filter="url(#softGlow)">
    <circle cx="68" cy="120" r="5" fill="#4d9fff"/>
    <circle cx="68" cy="180" r="5" fill="#4d9fff"/>
    <circle cx="68" cy="240" r="5" fill="#4d9fff"/>
    <circle cx="130" cy="150" r="6" fill="#7cb9ff"/>
    <circle cx="130" cy="210" r="6" fill="#7cb9ff"/>
    <circle cx="192" cy="180" r="7" fill="#aad4ff"/>
    <line x1="68" y1="120" x2="130" y2="150" stroke="#4d9fff" stroke-width="1.2"/>
    <line x1="68" y1="180" x2="130" y2="150" stroke="#4d9fff" stroke-width="1.2"/>
    <line x1="68" y1="180" x2="130" y2="210" stroke="#4d9fff" stroke-width="1.2"/>
    <line x1="68" y1="240" x2="130" y2="210" stroke="#4d9fff" stroke-width="1.2"/>
    <line x1="130" y1="150" x2="192" y2="180" stroke="#7cb9ff" stroke-width="1.5"/>
    <line x1="130" y1="210" x2="192" y2="180" stroke="#7cb9ff" stroke-width="1.5"/>
  </g>

  <!-- 右下角装饰线 -->
  <g opacity="0.12" stroke="#4d9fff" stroke-width="1" fill="none">
    <line x1="1100" y1="580" x2="1260" y2="580"/>
    <line x1="1120" y1="600" x2="1260" y2="600"/>
    <line x1="1140" y1="620" x2="1260" y2="620"/>
    <line x1="1160" y1="640" x2="1260" y2="640"/>
  </g>

  <!-- ── 左侧主体内容 ── -->

  <!-- 顶部徽标 -->
  <rect x="80" y="72" width="90" height="28" rx="14" fill="#1a4fff" opacity="0.9"/>
  <text x="125" y="91" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">AI 创作套件</text>

  <!-- 主标题 -->
  <text x="80" y="180" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="58" font-weight="800" fill="url(#titleGrad)" filter="url(#softGlow)">知乎 AI 创作</text>
  <text x="80" y="252" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="58" font-weight="800" fill="url(#titleGrad)" filter="url(#softGlow)">增长工具套件</text>

  <!-- 副标题 -->
  <text x="80" y="304" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" fill="#7ca8d4" letter-spacing="1">发现机会 · 生成内容 · 预测爆款 · 发布互动</text>

  <!-- 分割线 -->
  <rect x="80" y="330" width="480" height="2" rx="1" fill="url(#titleGrad)" opacity="0.4"/>

  <!-- 技术标签 -->
  <g font-family="Arial, monospace" font-size="13" fill="#4d9fff">
    <rect x="80" y="348" width="100" height="26" rx="5" fill="#1a4fff" fill-opacity="0.15" stroke="#1a4fff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="130" y="366" text-anchor="middle" fill="#7cb9ff">DeepSeek AI</text>

    <rect x="192" y="348" width="90" height="26" rx="5" fill="#1a4fff" fill-opacity="0.15" stroke="#1a4fff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="237" y="366" text-anchor="middle" fill="#7cb9ff">知乎 OpenAPI</text>

    <rect x="294" y="348" width="72" height="26" rx="5" fill="#1a4fff" fill-opacity="0.15" stroke="#1a4fff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="330" y="366" text-anchor="middle" fill="#7cb9ff">React + TS</text>

    <rect x="378" y="348" width="88" height="26" rx="5" fill="#1a4fff" fill-opacity="0.15" stroke="#1a4fff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="422" y="366" text-anchor="middle" fill="#7cb9ff">Cloudflare</text>
  </g>

  <!-- ── 右侧四个功能卡片 ── -->

  <!-- 卡片1：热榜蹭词器 -->
  <g transform="translate(620, 80)">
    <rect width="290" height="120" rx="14" fill="url(#card1)" stroke="#ff6b35" stroke-opacity="0.3" stroke-width="1"/>
    <text x="20" y="40" font-family="Arial" font-size="26">🔥</text>
    <text x="58" y="38" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#ff9a6c">热榜蹭词器</text>
    <text x="20" y="65" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#c0cfe8">实时监控热榜 TOP 30</text>
    <text x="20" y="84" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#c0cfe8">AI 领域匹配 · 一键开场白</text>
    <!-- 分数条 -->
    <rect x="20" y="98" width="250" height="6" rx="3" fill="#1a2a4a"/>
    <rect x="20" y="98" width="210" height="6" rx="3" fill="#ff6b35" opacity="0.7"/>
    <text x="275" y="106" font-family="Arial" font-size="11" fill="#ff9a6c" text-anchor="end">84%</text>
  </g>

  <!-- 卡片2：传播力预测器 -->
  <g transform="translate(930, 80)">
    <rect width="290" height="120" rx="14" fill="url(#card2)" stroke="#0066ff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="20" y="40" font-family="Arial" font-size="26">📊</text>
    <text x="58" y="38" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#6699ff">传播力预测器</text>
    <text x="20" y="65" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#c0cfe8">六维评分 · 发布前预测</text>
    <text x="20" y="84" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#c0cfe8">对标头部回答 · 优化建议</text>
    <!-- 六边形雷达图简化版 -->
    <g transform="translate(240, 55)" opacity="0.6">
      <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" stroke="#0066ff" stroke-width="1.2" fill="#0066ff" fill-opacity="0.1"/>
      <polygon points="0,-15 13,-7 13,7 0,15 -13,7 -13,-7" stroke="#0066ff" stroke-width="1" fill="#0066ff" fill-opacity="0.15"/>
    </g>
  </g>

  <!-- 卡片3：评论区截流器 -->
  <g transform="translate(620, 220)">
    <rect width="290" height="120" rx="14" fill="url(#card3)" stroke="#00c896" stroke-opacity="0.3" stroke-width="1"/>
    <text x="20" y="40" font-family="Arial" font-size="26">💬</text>
    <text x="58" y="38" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#00c896">评论区截流器</text>
    <text x="20" y="65" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#c0cfe8">批量拉取 500 条真实评论</text>
    <text x="20" y="84" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#c0cfe8">AI 识别高价值追问</text>
    <!-- 评论气泡装饰 -->
    <g transform="translate(240, 55)" opacity="0.5">
      <rect x="-30" y="-18" width="30" height="14" rx="7" fill="#00c896" fill-opacity="0.3"/>
      <rect x="-24" y="-0" width="24" height="14" rx="7" fill="#00c896" fill-opacity="0.2"/>
      <rect x="-28" y="18" width="28" height="14" rx="7" fill="#00c896" fill-opacity="0.25"/>
    </g>
  </g>

  <!-- 卡片4：垂直圈层雷达 -->
  <g transform="translate(930, 220)">
    <rect width="290" height="120" rx="14" fill="url(#card4)" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1"/>
    <text x="20" y="40" font-family="Arial" font-size="26">📡</text>
    <text x="58" y="38" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#c084fc">垂直圈层雷达</text>
    <text x="20" y="65" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#c0cfe8">分析垂直圈子话题热度</text>
    <text x="20" y="84" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#c0cfe8">挖掘蓝海机会 · 一键发布</text>
    <!-- 雷达波装饰 -->
    <g transform="translate(255, 55)" opacity="0.5" fill="none" stroke="#a855f7" stroke-width="1">
      <circle cx="0" cy="0" r="8"/>
      <circle cx="0" cy="0" r="16"/>
      <circle cx="0" cy="0" r="24"/>
      <line x1="0" y1="-26" x2="0" y2="-6" stroke-width="1.5"/>
    </g>
  </g>

  <!-- 底部流程箭头 -->
  <g transform="translate(620, 380)" opacity="0.9">
    <rect width="600" height="60" rx="10" fill="#0a1628" stroke="#1a3060" stroke-width="1"/>
    <!-- 流程节点 -->
    <g font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">
      <!-- 节点1 -->
      <circle cx="70" cy="30" r="18" fill="#ff6b35" fill-opacity="0.2" stroke="#ff6b35" stroke-opacity="0.5" stroke-width="1"/>
      <text x="70" y="26" fill="#ff9a6c" font-size="11">发现</text>
      <text x="70" y="40" fill="#ff9a6c" font-size="11">机会</text>
      <!-- 箭头 -->
      <text x="135" y="34" fill="#4d6a8a" font-size="18">→</text>
      <!-- 节点2 -->
      <circle cx="200" cy="30" r="18" fill="#0066ff" fill-opacity="0.2" stroke="#0066ff" stroke-opacity="0.5" stroke-width="1"/>
      <text x="200" y="26" fill="#6699ff" font-size="11">生成</text>
      <text x="200" y="40" fill="#6699ff" font-size="11">内容</text>
      <!-- 箭头 -->
      <text x="265" y="34" fill="#4d6a8a" font-size="18">→</text>
      <!-- 节点3 -->
      <circle cx="330" cy="30" r="18" fill="#00c896" fill-opacity="0.2" stroke="#00c896" stroke-opacity="0.5" stroke-width="1"/>
      <text x="330" y="26" fill="#00c896" font-size="11">预测</text>
      <text x="330" y="40" fill="#00c896" font-size="11">爆款</text>
      <!-- 箭头 -->
      <text x="395" y="34" fill="#4d6a8a" font-size="18">→</text>
      <!-- 节点4 -->
      <circle cx="460" cy="30" r="18" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1"/>
      <text x="460" y="26" fill="#c084fc" font-size="11">发布</text>
      <text x="460" y="40" fill="#c084fc" font-size="11">互动</text>
      <!-- 箭头 -->
      <text x="525" y="34" fill="#4d6a8a" font-size="18">→</text>
      <!-- 终点 -->
      <text x="575" y="26" fill="#ffd700" font-size="11">影响</text>
      <text x="575" y="40" fill="#ffd700" font-size="11">力↑</text>
    </g>
  </g>

  <!-- 左下角 slogan -->
  <text x="80" y="530" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#3a5a80">让每一个知乎创作者，都有 AI 助理</text>

  <!-- 底部分割线 -->
  <rect x="0" y="670" width="1280" height="1" fill="#1a3060" opacity="0.5"/>
  <!-- 底部信息 -->
  <text x="80" y="698" font-family="Arial, monospace" font-size="13" fill="#2a4a70">v3.0 · React 18 + TypeScript + DeepSeek + 知乎 OpenAPI</text>
  <text x="1200" y="698" font-family="Arial, monospace" font-size="13" fill="#2a4a70" text-anchor="end">2026</text>
</svg>
